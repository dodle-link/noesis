name: Core model tests

on:
  push:
    paths:
      - "core/model/**"
      - "core/tests/**"
      - ".github/workflows/core-model-tests.yml"
  pull_request:
    paths:
      - "core/model/**"
      - "core/tests/**"
      - ".github/workflows/core-model-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        numpy: [false, true]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional NumPy
        if: matrix.numpy
        run: python -m pip install numpy

      - name: Run core model tests
        run: python -m unittest discover -s core/tests -p 'test_model.py'