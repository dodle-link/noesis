name: Core model tests

on:
  push:
    paths:
      - "core/model/**"
      - "core/tests/**"
      - ".github/workflows/core-model-tests.yml"
  pull_request:
    paths:
      - "core/model/**"
      - "core/tests/**"
      - ".github/workflows/core-model-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run core model tests
        run: python -m unittest discover -s core/tests -p 'test_model.py'