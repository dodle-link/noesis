<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" />
    <title>Noesis Project v1.1.0</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/death-effects.css" />
    <link rel="stylesheet" href="css/rainbow-bubble.css" />
    <link rel="stylesheet" href="css/crt-effect.css" />
    <script src="brain/limbric.js" defer nonce="{{ nonce }}"></script>
    <script src="brain/energy-system.js" defer nonce="{{ nonce }}"></script>
    <script src="brain/simple-conscious.js" defer nonce="{{ nonce }}"></script>
    <script src="brain/audio-player.js" defer nonce="{{ nonce }}"></script>
    <script src="brain/crt-effect.js" defer nonce="{{ nonce }}"></script>
  </head>
  <body>
    <div class="wrapper">
      <div id="pixel-status">Status: Disconnected</div>
      <div class="content" role="main">
        <div id="noesis-logo" 
          class="illustration bubble-logo" 
          title="Click the bubble!">
          <div class="bubble-inner"></div>
          <div class="bubble-highlight"></div>
          <div class="bubble-highlight-secondary"></div>
          <img src="images/noesis-logo-black.png" class="bubble-logo-image" alt="Noesis Logo">
        </div>
        <h1 class="title">noesis</h1>
        <div class="instructions" id="web-info">
          <h2>Synthetic Sentience Pixel</h2>
          <p class="home-box">
            Noesis is a Synthetic Sentience system, focusing solely on low-level logic and memory structures.
          </p>
          <p>
            <b>GitHub</b> : <a href="https://github.com/dodle-link/noesis">Noesis Project</a><br>
            <b>Arcade Game</b> : <a href="game/index.html">Play Energy Surge</a>
          </p>
          <div class="crt-toggle-container">
            <label class="crt-toggle-switch">
              <input type="checkbox" id="crt-toggle">
              <span class="crt-toggle-slider"></span>
            </label>
            <span class="crt-toggle-label">Play Sound</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
