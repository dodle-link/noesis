<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Floating Pixel</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
		}

		.pixel {
			position: fixed;
			top: 50%;
			left: 50%;
			width: 5px;
			height: 5px;
			background: #fff;
			will-change: transform;
		}
	</style>
</head>
<body>
	<div class="pixel" aria-hidden="true"></div>
	<script src="./me.js"></script>
</body>
</html>
